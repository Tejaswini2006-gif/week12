
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #F8F9FE;
            color: #44445A;
            text-align: center;
        }

        header {
            background-color: #DCEBFA;
            color: #425B76;
            padding: 30px;
        }

        nav {
            background-color: #EEE7FA;
            padding: 15px;
        }

        nav a {
            color: #62527D;
            text-decoration: none;
            margin: 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: #B58ACB;
        }

        main {
            padding: 35px 20px;
        }

        section {
            background-color: #FFFFFF;
            max-width: 600px;
            margin: 25px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #DDE1EE;
        }

        button {
            background-color: #C9DDF5;
            color: #354B66;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #B8D0EF;
        }

        footer {
            background-color: #E5E9F5;
            color: #555570;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header id="home">
        <h1>My First Website</h1>
        <p>A little corner of the internet 🌸</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <main>
        <h2>Welcome! 💜</h2>
        <p>Explore my simple and beautiful website.</p>

        <button onclick="alert('Hello! Welcome to my website! 😊')">
            Click Me
        </button>

        <section id="about">
            <h2>About Us</h2>
            <p>This is a simple website designed with soft pastel colors.</p>
        </section>

        <section id="contact">
            <h2>Contact Us</h2>
            <p>Email: example@gmail.com</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My First Website. All rights reserved.</p>
    </footer>

</body>
</html>
